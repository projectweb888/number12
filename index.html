<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Helvetica Neue', 'Inter', system-ui, sans-serif;
    background:#0a0a0a;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.10), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,.07), transparent 45%),
      radial-gradient(circle at 60% 10%, rgba(255,255,255,.05), transparent 40%);
    overflow:hidden;
  }

  .orb { position:fixed; border-radius:50%; filter:blur(70px); opacity:.16; background:#fff; }
  .orb.a { width:340px; height:340px; top:-90px; left:-70px; animation:float 14s ease-in-out infinite; }
  .orb.b { width:280px; height:280px; bottom:-80px; right:-50px; animation:float 18s ease-in-out infinite reverse; }
  @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-40px)} }

  .calc {
    position:relative;
    width:340px; padding:26px 22px 22px;
    border-radius:28px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.22);
  }

  .screen {
    text-align:right; padding:8px 10px 22px; color:#fff;
    min-height:110px; display:flex; flex-direction:column; justify-content:flex-end;
  }
  .history { font-size:14px; color:rgba(255,255,255,.42); min-height:20px; letter-spacing:.5px; }
  .display {
    font-size:46px; font-weight:200; letter-spacing:-1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:font-size .25s ease;
  }
  .display.love {
    font-size:34px; font-weight:300; font-style:italic; letter-spacing:2px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.72; transform:scale(1.03)} }

  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; }

  button {
    height:64px; border:none; cursor:pointer;
    border-radius:20px; font-size:21px; font-weight:300; color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  button:hover { background:rgba(255,255,255,.18); box-shadow:0 6px 18px rgba(0,0,0,.35); }
  button:active { transform:scale(.93); background:rgba(255,255,255,.28); }

  .fn  { background:rgba(255,255,255,.14); font-weight:400; }
  .op  { background:rgba(255,255,255,.20); font-weight:400; }
  .eq  { background:rgba(255,255,255,.92); color:#111; font-weight:500; }
  .eq:hover { background:#fff; }
  .span2 { grid-column:span 2; }
</style>
</head>
<body>
<div class="orb a"></div>
<div class="orb b"></div>

<div class="calc">
  <div class="screen">
    <div class="history" id="history"></div>
    <div class="display" id="display">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="sign">+/−</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="span2" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</div>

<script>
const displayEl = document.getElementById('display');
const historyEl = document.getElementById('history');

let current = '0';
let previous = null;
let operator = null;
let justEvaluated = false;

const SYMBOL = { '+':'+', '-':'−', '*':'×', '/':'÷' };

function render(text) {
  displayEl.textContent = text;
  displayEl.classList.toggle('love', text === 'I Love You');
}

function inputNumber(n) {
  if (justEvaluated) { current = '0'; justEvaluated = false; }
  if (n === '.') {
    if (current.includes('.')) return;
    current += '.';
  } else {
    current = current === '0' ? n : current + n;
  }
  render(current);
}

function chooseOperator(op) {
  previous = parseFloat(current) || 0;
  operator = op;
  justEvaluated = true;
  historyEl.textContent = `${previous} ${SYMBOL[op]}`;
}

function compute() {
  if (operator === null || previous === null) return;

  const a = previous, b = parseFloat(current) || 0;
  historyEl.textContent = `${a} ${SYMBOL[operator]} ${b} =`;

  // 💌 ทุกเครื่องหมายให้ผลลัพธ์เดียวกัน
  render('I Love You');

  current = '0';
  previous = null;
  operator = null;
  justEvaluated = true;
}

document.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    const { num, op, act } = btn.dataset;
    if (num !== undefined) return inputNumber(num);
    if (op !== undefined)  return chooseOperator(op);

    if (act === 'clear') {
      current = '0'; previous = null; operator = null; justEvaluated = false;
      historyEl.textContent = '';
      render('0');
    }
    if (act === 'sign') {
      current = String(parseFloat(current) * -1);
      render(current);
    }
    if (act === 'percent') {
      current = String(parseFloat(current) / 100);
      render(current);
    }
    if (act === 'equals') compute();
  });
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (/[0-9.]/.test(k) && k.length === 1) inputNumber(k);
  else if (['+','-','*','/'].includes(k)) chooseOperator(k);
  else if (k === 'Enter' || k === '=') { e.preventDefault(); compute(); }
  else if (k === 'Escape') document.querySelector('[data-act="clear"]').click();
});
</script>
</body>
</html>
